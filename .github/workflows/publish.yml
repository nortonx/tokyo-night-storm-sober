name: publish

# Second half of the release chain. release.yml (cocogitto) decides the version,
# bumps manifest.json, tags, and creates the GitHub Release. Pushing that tag
# triggers this workflow, which packages and ships to the Chrome Web Store.
#
# Tags only. Never add pull_request: a fork PR would expose credentials on
# this public repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the store as well as uploading'
        type: boolean
        default: false

permissions:
  contents: write   # attach the ZIP to the release
  id-token: write   # mint the federated token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The store item cannot exist until Google finishes verifying the developer
      # account, and the API cannot create it. Until the secrets are set, skip the
      # publishing half rather than failing every release red: a recurring false
      # failure teaches you to ignore CI. This reports as skipped, never as passed.
      - name: Is the store configured?
        id: gate
        env:
          ITEM: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER: ${{ secrets.CWS_PUBLISHER_ID }}
          WIF: ${{ secrets.GCP_WIF_PROVIDER }}
          SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ -n "$ITEM" ] && [ -n "$PUBLISHER" ] && [ -n "$WIF" ] && [ -n "$SA" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Web Store secrets not configured; packaging only, not publishing."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          fi
          # The tag name reaches later shell steps, so constrain it to digits and
          # dots before it goes anywhere near an interpolation.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "refusing version '$VERSION': expected digits and dots only" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify the verifier
        run: ./tests/verify_test.sh

      - name: Verify invariants
        run: ./scripts/verify.sh

      # package.sh prints the path it built as its last line. Capturing that
      # keeps one definition of the artifact name: the two steps below used to
      # rebuild the string by hand, so a rename broke the upload and the release
      # attach in the same run.
      - name: Build package
        id: pkg
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -o pipefail
          ZIP=$(./scripts/package.sh "$VERSION" | tail -1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Upload to the Chrome Web Store
        if: steps.gate.outputs.ready == 'true'
        env:
          PUBLISHER: ${{ secrets.CWS_PUBLISHER_ID }}
          ITEM: ${{ secrets.CWS_EXTENSION_ID }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          TOKEN=$(gcloud auth print-access-token \
            --scopes="https://www.googleapis.com/auth/chromewebstore")
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -X POST -T "$ZIP" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER/items/$ITEM:upload"

      - name: Publish
        if: steps.gate.outputs.ready == 'true' && (github.ref_type == 'tag' || inputs.publish)
        env:
          PUBLISHER: ${{ secrets.CWS_PUBLISHER_ID }}
          ITEM: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          TOKEN=$(gcloud auth print-access-token \
            --scopes="https://www.googleapis.com/auth/chromewebstore")
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $TOKEN" \
            -X POST -H "Content-Length: 0" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER/items/$ITEM:publish"

      # release.yml already created the Release object for this tag (IR9), so this
      # uploads an asset to it rather than creating a second one. The tag push that
      # triggered this workflow races cog's `gh release create`, so wait for it.
      - name: Attach the package to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "waiting for release $TAG to exist (attempt $attempt)"
            sleep 6
          done
          # A tag pushed by hand (the v1.0.0 baseline, or any manual tag) never went
          # through release.yml, so no Release exists to attach to. Create one rather
          # than failing; `|| true` covers the race where cog created it meanwhile.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release for $TAG; creating one (manually pushed tag)"
            gh release create "$TAG" --title "$TAG" --generate-notes || true
          fi
          gh release upload "$TAG" "$ZIP" --clobber
