# One definition of the cocogitto pin. It was duplicated across ci.yml and
# release.yml (three install steps), so bumping one and not the other would let
# a PR pass `cog check` under a different cog than the release runs, which is
# precisely the drift ci.yml exists to prevent.
#
# Deliberately NOT cached. release.yml downloads this twice per release, once
# per job, which costs a couple of seconds. Caching would restore a binary that
# runs with `contents: write` from a store any branch in the repo can write to,
# skipping the checksum that is the only thing vouching for it. Two seconds is
# not worth that.
name: Install cocogitto
description: Install the pinned, checksum-verified cog binary and put it on PATH.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        COG_VERSION: "7.0.0"        # IR10
        COG_SHA256: "e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb"
      run: |
        curl -fsSL "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tar.gz
        echo "${COG_SHA256}  /tmp/cog.tar.gz" | sha256sum -c -
        tar xzf /tmp/cog.tar.gz -C /tmp
        sudo mv /tmp/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
