# Pull-request checks. Runs the same invariants as release.yml's gate, so a PR
# fails on breakage rather than the release doing so later.
#
# This does NOT gate release.yml: GitHub Actions cannot express `needs:` across
# workflows. release.yml re-runs these checks at push time for that reason.

name: ci

# Pull requests only. release.yml's ci-success runs the same checks on push
# to main, so a push trigger here just doubles every merge.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COG_VERSION: "7.0.0"
  COG_SHA256: "e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify theme invariants
        run: ./scripts/verify.sh

      - name: Package builds and contains only the allowlist
        run: ./scripts/package.sh

      - name: Install cocogitto
        run: |
          curl -fsSL "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cog.tar.gz
          echo "${COG_SHA256}  /tmp/cog.tar.gz" | sha256sum -c -
          tar xzf /tmp/cog.tar.gz -C /tmp
          sudo mv /tmp/x86_64-unknown-linux-musl/cog /usr/local/bin/cog

      # IR1, CI leg: lint the commit RANGE, not a PR title.
      - name: Check commit messages
        run: cog check --from-latest-tag
